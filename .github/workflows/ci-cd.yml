name: First-Agent CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  ci-test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint code with Ruff
        run: ruff check . --select E9,F63,F7,F82

      - name: Run automated tests
        run: pytest -v

  cd-package-release:
    needs: ci-test-and-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build release bundle
        run: |
          mkdir -p dist
          zip -r dist/First-Agent-release.zip agent.py requirements.txt .gitignore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: First-Agent-Bundle
          path: dist/First-Agent-release.zip